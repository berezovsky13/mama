apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: flask-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: berezovsky8/flask-visits:v2
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: flask-db-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: flask-db-secret, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: flask-db-secret, key: DB_PASSWORD }
---
apiVersion: v1
kind: Service
metadata:
  name: flask
  namespace: flask-project
spec:
  type: NodePort
  selector:
    app: flask
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081

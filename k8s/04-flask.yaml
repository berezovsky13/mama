apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: berezovsky8/flask-visit-counter:1.0.1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: db-config }
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: DB_PASSWORD }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: flask-project
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081

apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: flask-project
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: flask-db-secret, key: DB_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: flask-db-secret, key: DB_PASSWORD }
          command:
            - psql
            - -h
            - postgres
            - -d
            - visitsdb
            - -c
            - CREATE TABLE IF NOT EXISTS visits (id SERIAL PRIMARY KEY, visited_at TIMESTAMP DEFAULT now());
